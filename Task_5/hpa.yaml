apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fogis-backend-hpa
  labels:
    app: fogis-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fogis-backend
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60